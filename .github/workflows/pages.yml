# Deploys the site to GitHub Pages on every push to main.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Replaces the legacy "pages-build-deployment" (Jekyll) pipeline, whose deploy
# step hard-codes a 10-minute timeout.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling one mid-sync.
concurrency:
  group: pages
  cancel-in-progress: false

# Build and deploy run as separate jobs (GitHub's starter-workflow layout). With both in
# one job, deploy-pages ran ~1 s after the upload and found no artifact ("No artifacts
# named github-pages"), failing every deploy from 2026-11-23 ~22:00 UTC. A failed deploy
# should be retried with a fresh run (workflow_dispatch), not "Re-run jobs".
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Publish only what the site loads at runtime: the pages and data-*.html
      # fragments, NET / quadrant data (net-*.json, quads-*.json), team logos,
      # the social-card image, and the custom domain.
      - name: Assemble site
        run: |
          mkdir _site
          cp *.html thumbnail.png CNAME _site/
          for f in net-*.json quads-*.json bpi-*.json; do if [ -e "$f" ]; then cp "$f" _site/; fi; done
          cp -r cbb-logos _site/
          du -sh _site
          ls _site | wc -l

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # 30 min (default 10 min)
